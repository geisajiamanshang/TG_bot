services:
  ssc-bot:
    build: .
    container_name: ssc-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; raise SystemExit(0 if pathlib.Path('/data/healthy').exists() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
